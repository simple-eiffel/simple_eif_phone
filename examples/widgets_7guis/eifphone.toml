[app]
id = "io.github.ljr1981.eifphone.sevenguis"
label = "Eiffel 7GUIs"
version_code = 1
version_name = "0.1.0"

[eiffel]
ecf = "widgets_7guis.ecf"
target = "widgets_7guis"

[android]
abis = ["arm64-v8a", "x86_64"]
min_sdk = 26
target_sdk = 36
java_helper = true

[native]
include = ["$EIFPHONE_NATIVE/out/$ABI/sysroot/include/cairo", "$SIMPLE_EIFFEL/simple_cairo/Clib"]
libraries = ["$EIFPHONE_NATIVE/out/$ABI/sysroot/lib/libcairo.a", "$EIFPHONE_NATIVE/out/$ABI/sysroot/lib/libpixman-1.a", "$EIFPHONE_NATIVE/out/$ABI/sysroot/lib/libfreetype.a", "$EIFPHONE_NATIVE/out/$ABI/sysroot/lib/libpng16.a", "$EIFPHONE_NATIVE/out/$ABI/sysroot/lib/libz.a"]
